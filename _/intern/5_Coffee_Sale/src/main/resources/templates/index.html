<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Кофе - Главная</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" href="/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/bootstrap-icons.min.css}" href="/css/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">

    <script th:src="@{/js/bootstrap.bundle.min.js}" src="/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/axios.min.js}" src="/js/axios.min.js"></script>
    <script th:src="@{/js/script.js}" src="/js/script.js"></script>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Кофейная система</a>
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/coffee}">Кофе</a>
                </li>
                <li  class="nav-item">
                    <a class="nav-link" th:href="@{/inventory/coffee}">Кофейный запас</a>
                </li>
                <li  sec:authorize="hasAuthority('ADMIN')" class="nav-item">
                    <a class="nav-link" th:href="@{/inventory/merch}">Товарный запас</a>
                </li>
                <li sec:authorize="hasAuthority('OWNER')" class="nav-item">
                    <a class="nav-link" th:href="@{/coffeehouse}">Магазины</a>
                </li>
                <li sec:authorize="hasAuthority('ADMIN')" class="nav-item">
                    <a class="nav-link" th:href="@{/supplier}">Поставщики</a>
                </li>
            </ul>
            <div sec:authorize="isAuthenticated()" class="user-dropdown ms-2">
                <div class="dropdown">
                    <button class="btn dropdown-toggle"
                            type="button"
                            id="userDropdown"
                            data-bs-toggle="dropdown"
                            aria-expanded="false">
                        <img th:src="@{/images/avatar.png}"
                             src="/images/avatar.png"
                             alt="Avatar"
                             class="rounded-circle me-2"
                             style="width: 30px; height: 30px;">
                        <span sec:authentication="name"></span>
                    </button>
                    <ul class="dropdown-menu" aria-labelledby="userDropdown">
                        <li>
                            <span class="dropdown-item-text">
                                <span sec:authentication="principal.authorities"></span>
                            </span>
                        </li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="mb-0">
                                <button type="submit" class="dropdown-item btn btn-primary">Выйти</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</nav>

<div class="main-content">
    <div class="container mt-4">
        <div class="welcome-message">
            <h1>Добро пожаловать в кофейную систему управления!</h1>
            <p>Используйте навигационную панель для доступа к различным разделам системы.</p>
        </div>
    </div>
</div>

<footer class="footer mt-auto py-3 bg-light">
    <div class="container">
        <span class="text-muted">Кофейная система управления © 2025</span>
    </div>
</footer>

</body>
</html>
